<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F7FC"/>
      <stop offset="100%" stop-color="#EEF1F8"/>
    </linearGradient>
    <linearGradient id="app" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ECE9FF"/>
      <stop offset="100%" stop-color="#E1DDFF"/>
    </linearGradient>
    <linearGradient id="ext" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF1EB"/>
      <stop offset="100%" stop-color="#FFE3D9"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E9F2FF"/>
      <stop offset="100%" stop-color="#DCEBFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#98A1B6" flood-opacity=".20"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A7E8C"/>
    </marker>
    <style>
      .title { font: 700 34px "Plus Jakarta Sans", Arial, sans-serif; fill:#292A37; }
      .subtitle { font: 500 17px "Plus Jakarta Sans", Arial, sans-serif; fill:#6A6D7C; }
      .node-title { font: 700 20px "Plus Jakarta Sans", Arial, sans-serif; fill:#2E3040; }
      .node-sub { font: 500 14px "Plus Jakarta Sans", Arial, sans-serif; fill:#6D7080; }
      .label { font: 700 12px "Plus Jakarta Sans", Arial, sans-serif; fill:#656979; letter-spacing:1.2px; }
      .legend { font: 600 13px "Plus Jakarta Sans", Arial, sans-serif; fill:#5E6271; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="80" y="78" class="title">ChatSite — High-Level Architecture</text>
  <text x="80" y="108" class="subtitle">URL ingestion → grounded AI chat → persistence, auth, caching and observability</text>

  <!-- Section labels -->
  <text x="90" y="165" class="label">CLIENT</text>
  <text x="435" y="165" class="label">APPLICATION</text>
  <text x="1100" y="165" class="label">DATA / INFRA</text>
  <text x="565" y="560" class="label">EXTERNAL SERVICES</text>

  <!-- Main nodes -->
  <g filter="url(#shadow)">
    <rect x="80" y="210" width="250" height="128" rx="24" fill="#FFFFFF" stroke="#D8D5F6" stroke-width="2"/>
    <rect x="390" y="210" width="250" height="128" rx="24" fill="url(#app)" stroke="#BFB6FF" stroke-width="2"/>
    <rect x="700" y="210" width="250" height="128" rx="24" fill="url(#app)" stroke="#BFB6FF" stroke-width="2"/>
    <rect x="1010" y="210" width="250" height="128" rx="24" fill="url(#data)" stroke="#B7D0F8" stroke-width="2"/>
    <rect x="1300" y="210" width="220" height="128" rx="24" fill="url(#data)" stroke="#B7D0F8" stroke-width="2"/>
  </g>

  <!-- Main node icons -->
  <circle cx="125" cy="252" r="18" fill="#5A51E6"/>
  <circle cx="125" cy="245" r="7" fill="#FFFFFF"/>
  <path d="M112 264c4-8 22-8 26 0" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <rect x="430" y="241" width="28" height="22" rx="6" fill="#FFFFFF" stroke="#5A51E6" stroke-width="3"/>
  <path d="M439 267l6-5h9" fill="none" stroke="#5A51E6" stroke-width="3" stroke-linecap="round"/>
  <circle cx="748" cy="251" r="15" fill="#FFFFFF" stroke="#5A51E6" stroke-width="3"/>
  <path d="M741 251h14M748 244v14" stroke="#5A51E6" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="1054" cy="246" rx="20" ry="8" fill="#FFFFFF" stroke="#4C82D9" stroke-width="3"/>
  <path d="M1034 246v24c0 5 9 9 20 9s20-4 20-9v-24" fill="#FFFFFF" stroke="#4C82D9" stroke-width="3"/>
  <circle cx="1340" cy="251" r="18" fill="#FFFFFF" stroke="#4C82D9" stroke-width="3"/>

  <!-- Main labels -->
  <text x="160" y="249" class="node-title">Browser</text>
  <text x="160" y="274" class="node-sub">Next.js UI / React</text>
  <text x="160" y="298" class="node-sub">URL input, chat, history</text>

  <text x="470" y="249" class="node-title">Route Handlers</text>
  <text x="470" y="274" class="node-sub">/api/scrape</text>
  <text x="470" y="298" class="node-sub">/api/chat · auth checks</text>

  <text x="780" y="249" class="node-title">Service Layer</text>
  <text x="780" y="274" class="node-sub">ScrapingService</text>
  <text x="780" y="298" class="node-sub">ChatService + validation</text>

  <text x="1090" y="249" class="node-title">Repositories</text>
  <text x="1090" y="274" class="node-sub">Prisma data access</text>
  <text x="1090" y="298" class="node-sub">PostgreSQL persistence</text>

  <text x="1352" y="249" class="node-title">Upstash Redis</text>
  <text x="1352" y="274" class="node-sub">cache + rate limiting</text>

  <!-- arrows -->
  <path d="M330 274 H390" stroke="#7A7E8C" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M640 274 H700" stroke="#7A7E8C" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M950 274 H1010" stroke="#7A7E8C" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M1260 274 H1300" stroke="#7A7E8C" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- External services -->
  <g filter="url(#shadow)">
    <rect x="250" y="610" width="250" height="120" rx="24" fill="url(#ext)" stroke="#F5BEA8" stroke-width="2"/>
    <rect x="675" y="610" width="250" height="120" rx="24" fill="url(#ext)" stroke="#F5BEA8" stroke-width="2"/>
    <rect x="1100" y="610" width="250" height="120" rx="24" fill="url(#ext)" stroke="#F5BEA8" stroke-width="2"/>
  </g>

  <!-- External icons -->
  <circle cx="295" cy="652" r="17" fill="#FF8A65"/>
  <path d="M288 646l12 12M300 646l-12 12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <path d="M718 653l14-9 14 9-14 9z" fill="#FFFFFF" stroke="#5A51E6" stroke-width="3"/>
  <path d="M732 662v16" stroke="#5A51E6" stroke-width="3"/>
  <circle cx="1145" cy="653" r="17" fill="#FFFFFF" stroke="#5A51E6" stroke-width="3"/>
  <path d="M1138 653c8-10 16 10 24 0" fill="none" stroke="#5A51E6" stroke-width="3"/>

  <text x="330" y="650" class="node-title">Firecrawl API</text>
  <text x="330" y="675" class="node-sub">Web extraction / scraping</text>

  <text x="755" y="650" class="node-title">Google Gemini</text>
  <text x="755" y="675" class="node-sub">Grounded streaming answers</text>

  <text x="1180" y="650" class="node-title">Sentry</text>
  <text x="1180" y="675" class="node-sub">Error tracking / observability</text>

  <!-- connections -->
  <path d="M825 338 V500 H375 V610" stroke="#9A7D76" stroke-width="3" fill="none" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <path d="M825 338 V610" stroke="#9A7D76" stroke-width="3" fill="none" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <path d="M825 338 V500 H1225 V610" stroke="#9A7D76" stroke-width="3" fill="none" stroke-dasharray="8 8" marker-end="url(#arrow)"/>

  <!-- Auth / cross cutting -->
  <g filter="url(#shadow)">
    <rect x="80" y="610" width="110" height="120" rx="24" fill="#FFFFFF" stroke="#D4D6E1" stroke-width="2"/>
  </g>
  <text x="135" y="650" text-anchor="middle" class="node-title">Auth.js</text>
  <text x="135" y="675" text-anchor="middle" class="node-sub">OAuth</text>
  <text x="135" y="696" text-anchor="middle" class="node-sub">JWT sessions</text>
  <path d="M515 338 V500 H135 V610" stroke="#7A7E8C" stroke-width="3" fill="none" stroke-dasharray="8 8" marker-end="url(#arrow)"/>

  <!-- Footer legend -->
  <rect x="80" y="790" width="1440" height="56" rx="18" fill="#FFFFFF" opacity=".82"/>
  <rect x="110" y="808" width="22" height="16" rx="5" fill="url(#app)" stroke="#BFB6FF"/>
  <text x="144" y="821" class="legend">Application</text>
  <rect x="290" y="808" width="22" height="16" rx="5" fill="url(#ext)" stroke="#F5BEA8"/>
  <text x="324" y="821" class="legend">External services</text>
  <rect x="500" y="808" width="22" height="16" rx="5" fill="url(#data)" stroke="#B7D0F8"/>
  <text x="534" y="821" class="legend">Data / infrastructure</text>
  <line x1="770" y1="816" x2="810" y2="816" stroke="#7A7E8C" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="824" y="821" class="legend">Cross-cutting / integration</text>
</svg>